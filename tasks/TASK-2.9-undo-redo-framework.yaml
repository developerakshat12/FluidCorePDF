  - src/app/InkOverlay.{h,cpp} modifications — dispatch AddStrokeCommand, eraser stroke hit-testing (RemoveStrokeCommand/CompoundCommand), and stroke damage invalidation.
  - src/app/main.cpp modifications — wire Ctrl+Z (Undo) and Ctrl+Shift+Z / Ctrl+Y (Redo) accelerators and key handlers.
  - src/libfluidcore/CMakeLists.txt — link undo sources and register undo_stack_test in CTest.
  - specs/file-function-map.md — new rows for UndoStack and Commands.
  - planning/roadmap.yaml & planning/ROADMAP.md — mark undo/redo complete.
