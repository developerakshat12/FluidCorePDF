  - "UndoStack bounds capacity (maxDepth = 100) and clears on document destruction"
  - "Stroke undo/redo invalidates scoped bounding boxes via DamageRect"
  - "Eraser hit-testing generates CompoundCommand of RemoveStrokeCommands"
  - "Ctrl+Z and Ctrl+Shift+Z/Ctrl+Y shortcuts trigger undo and redo correctly"
