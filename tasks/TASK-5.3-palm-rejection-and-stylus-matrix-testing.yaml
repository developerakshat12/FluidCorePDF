deliverables:
  - src/libfluidcore/input/PalmRejectionEngine.{h,cpp} — pure C++20 arbitration state machine supporting Pen, Eraser, Touch, Mouse, dynamic hardware profiles (Wacom EMR/AES, Microsoft Surface, HP MPP, Generic), contact debounce, proximity tracking, and PenEventResult retroactive touch cancellation delivery.
  - src/libfluidcore/storage/ProjectStore.cpp — pressures_blob schema migration, little-endian binary encoding/decoding, defensive length validation (8*N bytes matching points_blob), and NULL fallback to base_width.
  - src/app/workspace/WorkspaceRenderer.cpp — variable-width vector stroke rendering using the unified pressure formula: w = base_width * (0.25 + 0.75 * p).
  - src/app/workspace/WorkspaceView.{h,cpp} — PalmRejectionEngine integration, device classification, contact debouncing, proximity callbacks, and retroactive touch cancellation for canvas drag/pan.
  - src/app/document/InkOverlay.{h,cpp} — PalmRejectionEngine integration, device classification, contact debouncing, proximity callbacks, and touch cancellation for PDF document annotations.
  - src/app/document/DocumentPane.{h,cpp} — setPalmRejectionEngine setter and forwarding to child InkOverlay on document load/lifecycle.
  - src/app/main.cpp — shared PalmRejectionEngine instantiation per window and wiring into DocumentPane and WorkspaceView.
  - src/libfluidcore/tests/input/StylusMatrixTest.cpp — comprehensive headless CTest suite validating all hardware profiles, touch cancellation latency, contact bounce, proximity hover, and multi-touch rejection.
