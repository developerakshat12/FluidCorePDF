id: TASK-2.10-basic-text-selection-and-copy
title: Basic text selection, multi-page highlight rendering, and clipboard copy
milestone: M1
workspace: D:\Reference Repos\fluidcore-platform
specs:
  - specs/integration.md (section 2 — cross-pane excerpt and selection)
  - specs/system-architecture.md (Poppler/Cairo layer, input handling)
  - specs/file-function-map.md (TextSelection, TextSelectionService, InkOverlay rows)
  - skills/cpp-core-dev/SKILL.md
  - skills/gtk-frontend/SKILL.md
dependencies:
  - TASK-2.1-poppler-document-pane
  - TASK-2.5-ink-annotations-on-pdf
  - TASK-2.6-thumbnails-sidebar
  - TASK-2.7-dirty-rect-and-tile-cache
  - TASK-2.8-stroke-stabilizer
