deliverables:
  - src/libfluidcore/workspace/PhysicsSolver.{h,cpp} — pure C++20 geometric proximity solver supporting 16pt magnetic proximity thresholds (scaled to world coordinates), 5-way horizontal/vertical edge alignment guidelines, and >50% symmetric intersection overlap ratio triggering SnapType::StackMerge.
  - src/libfluidcore/workspace/CardStackNode.{h,cpp} — hierarchical domain container managing an ordered collection of child WorkspaceNodes, compound translation, 5-level nesting depth limits with fallback flattening, and dynamic expanded cascade deck vs collapsed summary card layouts.
  - src/libfluidcore/workspace/WorkspaceModel.{h,cpp} — recursive node lookup, stack containment tracking, stack-aware dynamic bounds resolution for connector routing, and auto-dissolve behavior when stack child count drops to <= 1.
  - src/libfluidcore/undo/WorkspaceCommands.{h,cpp} — StackMergeCommand, ExtractChildCommand, and ToggleStackCollapseCommand providing symmetric undo/redo history.
  - src/libfluidcore/FluidCoreAPI.h, FluidCoreEngine.{h,cpp} — public snapshot and command APIs for solveSnap, mergeNodesIntoStack, extractChildFromStack, and stack collapse inspection/mutation.
  - src/libfluidcore/tests/workspace/PhysicsSolverTest.cpp — comprehensive unit test suite covering symmetric overlap ratios, precedence rules, 5-way alignment, and zoom-adaptive thresholding.
  - src/libfluidcore/tests/workspace/CardStackNodeTest.cpp — comprehensive unit test suite validating child addition, compound translation, depth bounding, auto-dissolution, bounds propagation, and undo/redo operations.
  - src/app/WorkspaceView.{h,cpp} — interactive 6px drag initiation disambiguation, real-time magnetic guideline and docking aura visualization, chevron / double-click accordion collapse toggles, child extraction on drag, and Delete key node removal.
acceptance_checks:
  - "clang-format --dry-run --Werror clean on all touched files"
