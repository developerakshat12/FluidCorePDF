name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Boundary + offline scans (ADR-0001, GOVERNANCE §5)
        run: python3 ops/scripts/check_invariants.py
      - name: DCO sign-off check (GOVERNANCE §3)
        if: github.event_name == 'pull_request'
        run: python3 ops/scripts/check_invariants.py --check-dco "origin/${{ github.base_ref }}..HEAD"

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install clang-format
        run: pipx install clang-format==18.1.8
      - name: Check formatting
        run: |
          find src -name '*.h' -o -name '*.hpp' -o -name '*.cpp' -o -name '*.cc' \
            | xargs clang-format --dry-run --Werror

  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
            sanitize: OFF
          - compiler: clang-16
            cc: clang-16
            cxx: clang++-16
            sanitize: ON
    name: build (${{ matrix.compiler }})
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ${{ matrix.cc }} ${{ matrix.cxx }}
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DFLUIDCORE_SANITIZERS=${{ matrix.sanitize }}
      - name: Build
        run: cmake --build build
      - name: Test (headless ctest)
        run: ctest --test-dir build --output-on-failure

  app-shell:
    # GUI code compiles on runners but cannot open displays: compile-link only.
    # Runtime/visual verification happens locally (WSLg / dev container).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain + GTK3/Poppler/Cairo dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build g++ pkg-config libgtk-3-dev libpoppler-glib-dev libcairo2-dev
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DFLUIDCORE_BUILD_APP=ON
      - name: Build
        run: cmake --build build
      - name: Test (ctest)
        run: ctest --test-dir build --output-on-failure
      - name: Package Linux distributions (.deb & AppImage)
        run: |
          bash ops/scripts/package-deb.sh --build-dir build
          bash ops/scripts/package-appimage.sh --build-dir build
      - name: Smoke test Linux packages
        run: |
          dpkg-deb -I build/dist/fluidcore_0.9.0_amd64.deb
          dpkg-deb -c build/dist/fluidcore_0.9.0_amd64.deb
          test -f build/dist/FluidCore-0.9.0-x86_64.AppImage
          test -x build/dist/FluidCore-0.9.0-x86_64.AppImage
          test -x build/dist/AppDir/AppRun
      - name: Upload Linux distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluidcore-linux-x64
          path: |
            build/dist/fluidcore_0.9.0_amd64.deb
            build/dist/FluidCore-0.9.0-x86_64.AppImage
          if-no-files-found: error


  windows-build:
    name: windows (ucrt64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-poppler
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-binutils
      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -S . -B build-win -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DFLUIDCORE_BUILD_APP=ON
      - name: Build
        shell: msys2 {0}
        run: cmake --build build-win
      - name: Test (ctest)
        shell: msys2 {0}
        run: ctest --test-dir build-win --output-on-failure
      - name: Package Windows standalone distribution & installer
        run: powershell -ExecutionPolicy Bypass -File ops/scripts/package-windows.ps1 -BuildInstaller
      - name: Upload Windows distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluidcore-windows-x64
          path: |
            build-win/dist/fluidcore-windows-x64.zip
            build-win/dist/FluidCore-Setup-x64.exe
          if-no-files-found: error

